# Despliegue manual en Cloud Run. Necesita dos secretos en el repo:
#   GCP_PROJECT  -> ID del proyecto de Google Cloud
#   GCP_SA_KEY   -> JSON de una cuenta de servicio con roles Cloud Run Admin, Cloud Build Editor,
#                   Artifact Registry Admin, Service Account User y Storage Admin
name: Deploy Cloud Run
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run deploy consent-check --source . --project "${{ secrets.GCP_PROJECT }}" \
            --region europe-west1 --allow-unauthenticated --memory 2Gi --cpu 2 \
            --concurrency 2 --timeout 120 --max-instances 3 \
            --update-env-vars MAX_CONCURRENT=2,SCANS_PER_HOUR=10,ALLOWED_ORIGINS=https://richadsdigtmkt.github.io
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx playwright install --with-deps chromium && npm test
