# Compila la web (site/, Astro) y la publica en GitHub Pages.
# Con dominio propio: cambia SITE_URL a https://tudominio.de y BASE_PATH a / (y añade el dominio en Settings > Pages).
name: GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # Recompila cada mañana (06:17 en Madrid en invierno) para publicar los artículos cuya fecha ha llegado.
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  SITE_URL: https://tracking-check.de
  BASE_PATH: /
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Avisa a Bing (y por tanto a ChatGPT y Copilot), Yandex y otros buscadores de IndexNow
      # de todas las URLs del sitemap, para que se rastreen sin esperar.
      - name: IndexNow
        continue-on-error: true
        run: |
          sleep 30
          URLS=$(curl -s "$SITE_URL/sitemap-0.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          echo "$URLS"
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"tracking-check.de\",\"key\":\"9dee32612c4be708edb2e26f3c38676b\",\"keyLocation\":\"$SITE_URL/9dee32612c4be708edb2e26f3c38676b.txt\",\"urlList\":$URLS}"

