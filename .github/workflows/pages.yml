# Compila la web (site/, Astro) y la publica en GitHub Pages.
# Con dominio propio: cambia SITE_URL a https://tudominio.de y BASE_PATH a / (y añade el dominio en Settings > Pages).
name: GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # Recompila cada mañana (06:17 en Madrid en invierno) para publicar los artículos cuya fecha ha llegado.
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  SITE_URL: https://tracking-check.de
  BASE_PATH: /
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
